name: Update Key Vault Secrets

on:
  workflow_dispatch:
    inputs:
      secrets_json:
        description: 'JSON object containing Key Vault secrets names and values'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  update-keyvalut:
    runs-on: ubuntu-latest

    steps:
      - name: Login to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update Key Vault secrets
        env:
          KEYVAULT_NAME: ${{ vars.AZURE_KEYVAULT_NAME }}
          SECRETS_JSON: ${{ inputs.secrets_json }}
        shell: bash
        run: |
          set -euo pipefail
          
          echo "$SECRETS_JSON" | jq -r 'to_entries[] | [.key, .value] | @tsv' |
          while IFS=$'\t' read -r KEY VALUE; do
            echo "Updating Key Vault secret: $KEY"

            az keyvault secret set \
              --vault-name "$KEYVAULT_NAME" \
              --name "$KEY" \
              --value "$VALUE" \
              --output none
          done
